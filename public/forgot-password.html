<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Drexora Account</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand-header">
        <a href="/" class="brand-title">Drexora Account</a>
      </div>
      <h1 class="page-title">Reset Password</h1>
      <p class="page-subtitle">Enter your account email and we will send password reset instructions.</p>

      <div id="alert" class="alert"></div>

      <form id="forgot-form">
        <div class="form-group">
          <label for="email">Account Email</label>
          <input type="email" id="email" required placeholder="alex@example.com">
        </div>
        <button type="submit" id="submit-btn" class="btn">Send Password Reset Link</button>
      </form>

      <div class="auth-footer">
        <p>Remember your password? <a href="/login.html">Sign in</a></p>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    redirectIfAuthenticated();

    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert('alert');
      setLoading('submit-btn', true);

      const email = document.getElementById('email').value;

      try {
        const res = await API.post('/auth/forgot-password', { email });
        showAlert('alert', res.message, true);
        document.getElementById('forgot-form').reset();
      } catch (err) {
        showAlert('alert', err.message);
      } finally {
        setLoading('submit-btn', false);
      }
    });
  </script>
</body>
</html>
