<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drexora Test App B</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .test-app-wrapper {
      max-width: 560px;
      margin: 50px auto;
      padding: 32px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    .sso-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #0284c7;
      color: #ffffff;
      font-weight: 600;
      font-size: 1rem;
      padding: 14px 24px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s ease;
      text-decoration: none;
    }
    .sso-btn:hover {
      background: #0369a1;
    }
    .profile-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
    }
    .claim-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #e2e8f0;
    }
    .claim-row:last-child {
      border-bottom: none;
    }
    .claim-label {
      font-weight: 600;
      color: #475569;
    }
    .claim-val {
      font-family: monospace;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <div class="test-app-wrapper">
    <div style="text-align: center; margin-bottom: 24px;">
      <span style="background: #e0f2fe; color: #0284c7; font-size: 0.8rem; font-weight: 700; padding: 4px 10px; border-radius: 12px; text-transform: uppercase;">
        External Test Application B
      </span>
      <h1 style="font-size: 1.6rem; color: #0f172a; margin-top: 12px;">Second Independent Test App</h1>
      <p style="color: #64748b; font-size: 0.95rem;">
        Testing stable user identity across distinct registered applications with Drexora SSO.
      </p>
    </div>

    <div id="unauthenticated-view">
      <p style="text-align: center; color: #334155; margin-bottom: 20px;">
        Click below to authenticate Test App B with your Drexora Account.
      </p>
      <button id="sso-button" class="sso-btn">
        Continue with Drexora (App B)
      </button>
    </div>

    <div id="authenticated-view" style="display: none;">
      <div style="display: flex; align-items: center; gap: 10px; color: #10b981; font-weight: 600; margin-bottom: 16px;">
        <span style="font-size: 1.2rem;">✓</span> Authenticated Test App B
      </div>

      <div class="profile-box">
        <div class="claim-row">
          <span class="claim-label">Subject ID (sub):</span>
          <span id="claim-sub" class="claim-val">-</span>
        </div>
        <div class="claim-row">
          <span class="claim-label">Full Name:</span>
          <span id="claim-name" class="claim-val">-</span>
        </div>
        <div class="claim-row">
          <span class="claim-label">Email:</span>
          <span id="claim-email" class="claim-val">-</span>
        </div>
      </div>

      <button id="logout-btn" class="btn" style="background: #ef4444; margin-top: 20px;">
        Log Out from Test App B
      </button>
    </div>
  </div>

  <script>
    function generateRandomString(length) {
      const charset = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
      let result = '';
      const values = new Uint8Array(length);
      window.crypto.getRandomValues(values);
      for (let i = 0; i < length; i++) {
        result += charset[values[i] % charset.length];
      }
      return result;
    }

    async function generateCodeChallenge(verifier) {
      const encoder = new TextEncoder();
      const data = encoder.encode(verifier);
      const digest = await window.crypto.subtle.digest('SHA-256', data);
      const bytes = new Uint8Array(digest);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary)
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/, '');
    }

    const appUser = JSON.parse(sessionStorage.getItem('test_app_b_user') || 'null');

    if (appUser) {
      document.getElementById('unauthenticated-view').style.display = 'none';
      document.getElementById('authenticated-view').style.display = 'block';

      document.getElementById('claim-sub').textContent = appUser.sub || '-';
      document.getElementById('claim-name').textContent = appUser.name || '-';
      document.getElementById('claim-email').textContent = appUser.email || '-';
    }

    document.getElementById('sso-button').addEventListener('click', async () => {
      try {
        const verifier = generateRandomString(64);
        const challenge = await generateCodeChallenge(verifier);
        const state = generateRandomString(24);

        sessionStorage.setItem('oauth_pkce_verifier_b', verifier);
        sessionStorage.setItem('oauth_state_b', state);

        const clientId = 'dx_client_test_app_b';
        const redirectUri = window.location.origin + '/test-client/app2_callback.html';
        const scope = 'openid profile email';

        const IdpBaseUrl = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
          ? window.location.origin
          : 'https://drexora-account.onrender.com';

        const authUrl = new URL('/oauth/authorize', IdpBaseUrl);
        authUrl.searchParams.set('client_id', clientId);
        authUrl.searchParams.set('redirect_uri', redirectUri);
        authUrl.searchParams.set('response_type', 'code');
        authUrl.searchParams.set('scope', scope);
        authUrl.searchParams.set('state', state);
        authUrl.searchParams.set('code_challenge', challenge);
        authUrl.searchParams.set('code_challenge_method', 'S256');

        window.location.href = authUrl.toString();
      } catch (err) {
        alert('Failed to initiate SSO: ' + err.message);
      }
    });

    document.getElementById('logout-btn')?.addEventListener('click', () => {
      sessionStorage.removeItem('test_app_b_user');
      window.location.reload();
    });
  </script>
</body>
</html>
