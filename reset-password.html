<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — Drexora Account</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand-header">
        <a href="index.html" class="brand-title">Drexora Account</a>
      </div>
      <h1 class="page-title">Set New Password</h1>
      <p class="page-subtitle">Choose a new strong password for your Drexora Account.</p>

      <div id="alert" class="alert"></div>

      <form id="reset-form">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" required placeholder="At least 8 characters">
        </div>
        <div class="form-group">
          <label for="confirmNewPassword">Confirm New Password</label>
          <input type="password" id="confirmNewPassword" required placeholder="Repeat new password">
        </div>
        <button type="submit" id="submit-btn" class="btn">Update Password</button>
      </form>

      <div class="auth-footer">
        <p><a href="login.html">Return to Sign In</a></p>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');

    if (!token) {
      showAlert('alert', 'Missing or invalid password reset token.');
      document.getElementById('submit-btn').disabled = true;
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert('alert');

      const newPassword = document.getElementById('newPassword').value;
      const confirmNewPassword = document.getElementById('confirmNewPassword').value;

      if (newPassword !== confirmNewPassword) {
        showAlert('alert', 'Passwords do not match');
        return;
      }

      setLoading('submit-btn', true);

      try {
        const res = await API.post('/auth/reset-password', { token, newPassword, confirmNewPassword });
        showAlert('alert', res.message, true);
        document.getElementById('reset-form').reset();
        setTimeout(() => { window.location.href = 'login.html'; }, 2000);
      } catch (err) {
        showAlert('alert', err.message);
      } finally {
        setLoading('submit-btn', false);
      }
    });
  </script>
</body>
</html>
