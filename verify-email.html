<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email — Drexora Account</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand-header">
        <a href="index.html" class="brand-title">Drexora Account</a>
      </div>
      <h1 class="page-title">Email Verification</h1>
      <p class="page-subtitle" id="subtitle-status">Enter the 8-digit verification code sent to your email.</p>

      <div id="email-target-banner" style="display: none; background: #f3f4f6; padding: 10px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; color: #374151;">
        Code sent to: <strong id="target-email-display"></strong>
      </div>

      <div id="alert" class="alert"></div>

      <!-- 8-Digit Verification Form -->
      <form id="verify-code-form" style="margin-bottom: 24px;">
        <div class="form-group">
          <label for="code-input">8-Digit Verification Code</label>
          <input type="text" id="code-input" maxlength="8" pattern="[0-9]{8}" placeholder="e.g. 84920153" required style="font-family: monospace; font-size: 20px; letter-spacing: 4px; text-align: center;">
        </div>
        <button type="submit" id="verify-btn" class="btn">Verify Account</button>
      </form>

      <div id="action-container" style="display: none; margin-top: 20px;">
        <a href="login.html" class="btn">Proceed to Sign In</a>
      </div>

      <div id="resend-section" style="margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 20px;">
        <h3 style="font-size: 14px; font-weight: 600; margin-bottom: 8px;">Request new verification code</h3>
        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">Didn't receive the email or code expired?</p>
        <form id="resend-form">
          <div class="form-group">
            <input type="email" id="resend-email" placeholder="Your account email address" required>
          </div>
          <button type="submit" id="resend-btn" class="btn btn-secondary">Resend Verification Email</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const codeParam = urlParams.get('code') || urlParams.get('token');
    const action = urlParams.get('action');

    // Resolve email address for display & resend
    const urlEmail = urlParams.get('email');
    const storedEmail = sessionStorage.getItem('pendingVerificationEmail');
    const targetEmail = urlEmail || storedEmail || '';

    if (targetEmail) {
      document.getElementById('resend-email').value = targetEmail;
      document.getElementById('target-email-display').textContent = maskEmail(targetEmail);
      document.getElementById('email-target-banner').style.display = 'block';
    }

    function maskEmail(email) {
      if (!email || !email.includes('@')) return email;
      const parts = email.split('@');
      const name = parts[0];
      const domain = parts[1];
      if (name.length <= 2) return `${name[0]}*@${domain}`;
      return `${name[0]}***${name[name.length - 1]}@${domain}`;
    }

    // Auto-verify if code/token is provided in URL
    if (codeParam) {
      document.getElementById('code-input').value = codeParam.trim();
      submitVerification(codeParam.trim());
    }

    async function submitVerification(code) {
      hideAlert('alert');
      setLoading('verify-btn', true);
      document.getElementById('subtitle-status').textContent = 'Verifying your code...';

      try {
        const endpoint = action === 'email_change' ? '/auth/confirm-email-change' : '/auth/verify-email';
        const res = await API.post(endpoint, { code });

        document.getElementById('subtitle-status').textContent = 'Account verified successfully!';
        showAlert('alert', res.message || 'Email verified successfully!', true);
        document.getElementById('action-container').style.display = 'block';
        document.getElementById('verify-code-form').style.display = 'none';
        sessionStorage.removeItem('pendingVerificationEmail');

        // Redirect to login page after 2 seconds
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
      } catch (err) {
        document.getElementById('subtitle-status').textContent = 'Verification status:';
        showAlert('alert', err.message || 'Invalid or expired verification code.');
        setLoading('verify-btn', false);
      }
    }

    document.getElementById('verify-code-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = document.getElementById('code-input').value.trim();
      if (!code) {
        showAlert('alert', 'Please enter your 8-digit verification code.');
        return;
      }
      await submitVerification(code);
    });

    document.getElementById('resend-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert('alert');
      setLoading('resend-btn', true);

      const email = document.getElementById('resend-email').value.trim();

      try {
        const res = await API.post('/auth/resend-verification', { email });
        sessionStorage.setItem('pendingVerificationEmail', email);
        document.getElementById('target-email-display').textContent = maskEmail(email);
        document.getElementById('email-target-banner').style.display = 'block';
        showAlert('alert', res.message || 'A new 8-digit verification code has been sent.', true);
      } catch (err) {
        showAlert('alert', err.message || 'Failed to resend verification email.');
      } finally {
        setLoading('resend-btn', false);
      }
    });
  </script>
</body>
</html>
