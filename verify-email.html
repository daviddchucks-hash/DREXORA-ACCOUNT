<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email — Drexora Account</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand-header">
        <a href="index.html" class="brand-title">Drexora Account</a>
      </div>
      <h1 class="page-title">Email Verification</h1>
      <p class="page-subtitle" id="subtitle-status">Enter the 8-digit verification code sent to your email.</p>

      <div id="alert" class="alert"></div>

      <!-- 8-Digit Verification Form -->
      <form id="verify-code-form" style="margin-bottom: 24px;">
        <div class="form-group">
          <label for="code-input">8-Digit Verification Code</label>
          <input type="text" id="code-input" maxlength="8" pattern="[0-9]{8}" placeholder="e.g. 84920153" required style="font-family: monospace; font-size: 18px; letter-spacing: 4px; text-align: center;">
        </div>
        <button type="submit" id="verify-btn" class="btn">Verify Account</button>
      </form>

      <div id="action-container" style="display: none; margin-top: 20px;">
        <a href="login.html" class="btn">Proceed to Sign In</a>
      </div>

      <div id="resend-section" style="margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 20px;">
        <h3 style="font-size: 14px; font-weight: 600; margin-bottom: 8px;">Request new verification code</h3>
        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">Didn't receive the email? Enter your email address below to resend.</p>
        <form id="resend-form">
          <div class="form-group">
            <input type="email" id="resend-email" placeholder="Your account email address" required>
          </div>
          <button type="submit" id="resend-btn" class="btn btn-secondary">Resend Verification Email</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const codeParam = urlParams.get('code') || urlParams.get('token');
    const action = urlParams.get('action');

    // Auto-verify if code or token is provided in URL
    if (codeParam) {
      document.getElementById('code-input').value = codeParam.trim();
      autoVerify(codeParam.trim());
    }

    async function autoVerify(code) {
      hideAlert('alert');
      setLoading('verify-btn', true);
      document.getElementById('subtitle-status').textContent = 'Verifying your code...';

      try {
        const endpoint = action === 'email_change' ? '/auth/confirm-email-change' : '/auth/verify-email';
        const res = await API.post(endpoint, { code });
        document.getElementById('subtitle-status').textContent = 'Verification complete.';
        showAlert('alert', res.message, true);
        document.getElementById('action-container').style.display = 'block';
        document.getElementById('verify-code-form').style.display = 'none';
      } catch (err) {
        document.getElementById('subtitle-status').textContent = 'Verification failed:';
        showAlert('alert', err.message);
      } finally {
        setLoading('verify-btn', false);
      }
    }

    document.getElementById('verify-code-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const code = document.getElementById('code-input').value.trim();
      if (!code) return;
      await autoVerify(code);
    });

    document.getElementById('resend-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert('alert');
      setLoading('resend-btn', true);

      const email = document.getElementById('resend-email').value;

      try {
        const res = await API.post('/auth/resend-verification', { email });
        showAlert('alert', res.message, true);
      } catch (err) {
        showAlert('alert', err.message);
      } finally {
        setLoading('resend-btn', false);
      }
    });
  </script>
</body>
</html>
