<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Your Profile — Drexora Account</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .complete-wrapper {
      max-width: 680px;
      margin: 40px auto;
      padding: 0 20px;
      width: 100%;
    }
    .progress-container {
      background: #e5e7eb;
      border-radius: 8px;
      height: 12px;
      width: 100%;
      overflow: hidden;
      margin: 16px 0 24px 0;
    }
    .progress-bar {
      background: #111827;
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .full-width {
      grid-column: span 2;
    }
    .field-required {
      color: #dc2626;
    }
    .badge-verified {
      background: #ecfdf5;
      color: #059669;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .phone-verify-group {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      .full-width {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>
  <nav class="nav-bar">
    <div class="nav-container">
      <a href="account" class="brand-title">Drexora Account</a>
      <div class="nav-links">
        <a href="#" onclick="handleLogout(); return false;" class="nav-link" style="color: var(--danger-color);">Sign Out</a>
      </div>
    </div>
  </nav>

  <div class="complete-wrapper">
    <div class="card-section">
      <h1 class="page-title">Complete your Drexora Account</h1>
      <p class="page-subtitle">Complete your profile so Drexora services can securely identify your account and provide information to applications you authorize.</p>

      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600;">
        <span>Profile Completion</span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="progress-container">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <div id="alert" class="alert"></div>

      <form id="complete-profile-form">
        <!-- 1. Personal Information -->
        <h2 class="section-title">Personal Information</h2>
        <div class="form-grid" style="margin-bottom: 24px;">
          <div>
            <label for="firstName">First Name <span class="field-required">*</span></label>
            <input type="text" id="firstName" placeholder="e.g. Jane" required>
          </div>
          <div>
            <label for="lastName">Last Name <span class="field-required">*</span></label>
            <input type="text" id="lastName" placeholder="e.g. Doe" required>
          </div>
          <div class="full-width">
            <label for="displayName">Display Name <span style="font-size: 11px; color: var(--text-muted);">(Optional)</span></label>
            <input type="text" id="displayName" placeholder="e.g. Jane Doe">
          </div>
        </div>

        <!-- 2. Contact Information -->
        <h2 class="section-title">Contact Information</h2>
        <div class="form-grid" style="margin-bottom: 24px;">
          <div class="full-width">
            <label>Primary Email Address <span class="badge-verified">Verified</span></label>
            <input type="email" id="email" disabled style="background: #f3f4f6; cursor: not-allowed;">
          </div>
          <div class="full-width">
            <label for="phone">Phone Number <span class="field-required">*</span> <span id="phone-status-badge"></span></label>
            <div class="phone-verify-group">
              <input type="text" id="phone" placeholder="e.g. +1234567890" required style="flex: 1;">
              <button type="button" id="send-phone-code-btn" class="btn btn-secondary btn-sm" style="width: auto;">Verify Phone</button>
            </div>
            <div id="phone-verify-box" style="display: none; margin-top: 10px; background: #f9fafb; padding: 12px; border: 1px solid var(--border-color); border-radius: var(--radius);">
              <label for="phoneCode" style="font-size: 12px;">Enter 6-digit verification code</label>
              <div style="display: flex; gap: 8px;">
                <input type="text" id="phoneCode" maxlength="6" placeholder="123456" style="flex: 1; font-family: monospace; letter-spacing: 2px;">
                <button type="button" id="confirm-phone-code-btn" class="btn btn-sm">Submit Code</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 3. Location Information -->
        <h2 class="section-title">Location</h2>
        <div class="form-grid" style="margin-bottom: 24px;">
          <div>
            <label for="country">Country <span class="field-required">*</span></label>
            <input type="text" id="country" placeholder="e.g. United States" required>
          </div>
          <div>
            <label for="state">State / Province</label>
            <input type="text" id="state" placeholder="e.g. California">
          </div>
          <div>
            <label for="city">City</label>
            <input type="text" id="city" placeholder="e.g. San Francisco">
          </div>
          <div>
            <label for="postalCode">Postal / ZIP Code</label>
            <input type="text" id="postalCode" placeholder="e.g. 94105">
          </div>
          <div class="full-width">
            <label for="address">Address</label>
            <input type="text" id="address" placeholder="e.g. 123 Market Street, Suite 400">
          </div>
        </div>

        <!-- 4. Additional Information -->
        <h2 class="section-title">Additional Details</h2>
        <div class="form-grid" style="margin-bottom: 32px;">
          <div>
            <label for="dateOfBirth">Date of Birth</label>
            <input type="date" id="dateOfBirth">
          </div>
          <div>
            <label for="preferredLanguage">Preferred Language</label>
            <input type="text" id="preferredLanguage" placeholder="e.g. English">
          </div>
          <div class="full-width">
            <label for="profilePhoto">Profile Photo URL</label>
            <input type="text" id="profilePhoto" placeholder="e.g. https://example.com/avatar.jpg">
          </div>
        </div>

        <button type="submit" id="save-btn" class="btn" style="font-weight: 600;">Save Profile & Continue</button>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const returnTo = urlParams.get('return_to');

    let currentUser = null;

    async function loadProfile() {
      currentUser = await requireAuth();
      if (!currentUser) return;

      document.getElementById('firstName').value = currentUser.firstName || '';
      document.getElementById('lastName').value = currentUser.lastName || '';
      document.getElementById('displayName').value = currentUser.displayName || '';
      document.getElementById('email').value = currentUser.email || '';
      document.getElementById('phone').value = currentUser.phone || '';
      document.getElementById('country').value = currentUser.country || '';
      document.getElementById('state').value = currentUser.state || '';
      document.getElementById('city').value = currentUser.city || '';
      document.getElementById('address').value = currentUser.address || '';
      document.getElementById('postalCode').value = currentUser.postalCode || '';
      document.getElementById('dateOfBirth').value = currentUser.dateOfBirth || '';
      document.getElementById('preferredLanguage').value = currentUser.preferredLanguage || '';
      document.getElementById('profilePhoto').value = currentUser.profilePhoto || '';

      updatePhoneBadge(currentUser.phoneVerified, currentUser.phone);
      updateProgress(currentUser.profileStatus ? currentUser.profileStatus.completionPercentage : 0);
    }

    function updatePhoneBadge(verified, phoneNum) {
      const badge = document.getElementById('phone-status-badge');
      if (verified && phoneNum) {
        badge.innerHTML = '<span class="badge-verified">Verified</span>';
      } else if (phoneNum) {
        badge.innerHTML = '<span class="badge badge-unverified">Unverified</span>';
      } else {
        badge.innerHTML = '';
      }
    }

    function updateProgress(percent) {
      document.getElementById('progress-percent').textContent = `${percent}%`;
      document.getElementById('progress-bar').style.width = `${percent}%`;
    }

    loadProfile();

    // Send Phone Verification Code Action
    document.getElementById('send-phone-code-btn').addEventListener('click', async () => {
      hideAlert('alert');
      const phoneVal = document.getElementById('phone').value.trim();
      if (!phoneVal) {
        showAlert('alert', 'Please enter a phone number first.');
        return;
      }

      setLoading('send-phone-code-btn', true);

      try {
        const res = await API.post('/account/phone/send-verification', { phone: phoneVal });
        if (res.disabled) {
          showAlert('alert', res.message);
        } else {
          showAlert('alert', res.message, true);
          document.getElementById('phone-verify-box').style.display = 'block';
        }
      } catch (err) {
        showAlert('alert', err.message);
      } finally {
        setLoading('send-phone-code-btn', false, 'Verify Phone');
      }
    });

    // Confirm Phone Verification Code Action
    document.getElementById('confirm-phone-code-btn').addEventListener('click', async () => {
      hideAlert('alert');
      const codeVal = document.getElementById('phoneCode').value.trim();
      if (!codeVal) {
        showAlert('alert', 'Please enter the 6-digit code.');
        return;
      }

      setLoading('confirm-phone-code-btn', true);

      try {
        const res = await API.post('/account/phone/verify', { code: codeVal });
        showAlert('alert', res.message, true);
        document.getElementById('phone-verify-box').style.display = 'none';
        updatePhoneBadge(true, document.getElementById('phone').value);
      } catch (err) {
        showAlert('alert', err.message);
      } finally {
        setLoading('confirm-phone-code-btn', false, 'Submit Code');
      }
    });

    // Profile Form Submission
    document.getElementById('complete-profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert('alert');
      setLoading('save-btn', true);

      const payload = {
        firstName: document.getElementById('firstName').value.trim(),
        lastName: document.getElementById('lastName').value.trim(),
        displayName: document.getElementById('displayName').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        country: document.getElementById('country').value.trim(),
        state: document.getElementById('state').value.trim(),
        city: document.getElementById('city').value.trim(),
        address: document.getElementById('address').value.trim(),
        postalCode: document.getElementById('postalCode').value.trim(),
        dateOfBirth: document.getElementById('dateOfBirth').value.trim(),
        preferredLanguage: document.getElementById('preferredLanguage').value.trim(),
        profilePhoto: document.getElementById('profilePhoto').value.trim()
      };

      try {
        const res = await API.patch('/account/profile', payload);
        const updated = res.profile;

        if (updated.profileStatus) {
          updateProgress(updated.profileStatus.completionPercentage);
        }

        showAlert('alert', 'Profile updated successfully! Redirecting...', true);

        setTimeout(() => {
          if (returnTo) {
            window.location.href = returnTo;
          } else {
            window.location.href = 'account';
          }
        }, 1200);

      } catch (err) {
        showAlert('alert', err.message || 'Failed to save profile.');
        setLoading('save-btn', false, 'Save Profile & Continue');
      }
    });
  </script>
</body>
</html>
