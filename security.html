<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Settings — Drexora Account</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav-bar">
    <div class="nav-container">
      <a href="account.html" class="brand-title">Drexora Account</a>
      <div class="nav-links">
        <a href="account.html" class="nav-link">Profile</a>
        <a href="security.html" class="nav-link active">Security</a>
        <a href="sessions.html" class="nav-link">Sessions</a>
        <a href="#" onclick="handleLogout(); return false;" class="nav-link" style="color: var(--danger-color);">Sign Out</a>
      </div>
    </div>
  </nav>

  <div class="dashboard-wrapper">
    <h1 class="page-title">Security Settings</h1>
    <p class="page-subtitle">Manage your password and credentials.</p>

    <div id="alert" class="alert"></div>

    <div class="card-section">
      <h2 class="section-title">Change Password</h2>
      <form id="change-pass-form">
        <div class="form-group">
          <label for="currentPassword">Current Password</label>
          <input type="password" id="currentPassword" required autocomplete="current-password">
        </div>
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="confirmNewPassword">Confirm New Password</label>
          <input type="password" id="confirmNewPassword" required autocomplete="new-password">
        </div>
        <button type="submit" id="pass-btn" class="btn btn-sm">Update Password</button>
      </form>
    </div>

    <div class="card-section">
      <h2 class="section-title">Change Account Email</h2>
      <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">
        Request an email change. Your existing email address will remain active until you verify the new email address.
      </p>
      <form id="change-email-form">
        <div class="form-group">
          <label for="newEmail">New Email Address</label>
          <input type="email" id="newEmail" required placeholder="newemail@example.com">
        </div>
        <div class="form-group">
          <label for="emailCurrentPassword">Current Password</label>
          <input type="password" id="emailCurrentPassword" required placeholder="Confirm with password">
        </div>
        <button type="submit" id="email-btn" class="btn btn-sm btn-secondary">Request Email Change</button>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    requireAuth();

    document.getElementById('change-pass-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert('alert');

      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmNewPassword = document.getElementById('confirmNewPassword').value;

      if (newPassword !== confirmNewPassword) {
        showAlert('alert', 'New passwords do not match');
        return;
      }

      setLoading('pass-btn', true);

      try {
        const res = await API.post('/auth/change-password', { currentPassword, newPassword, confirmNewPassword });
        showAlert('alert', res.message, true);
        document.getElementById('change-pass-form').reset();
      } catch (err) {
        showAlert('alert', err.message);
      } finally {
        setLoading('pass-btn', false);
      }
    });

    document.getElementById('change-email-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert('alert');

      const newEmail = document.getElementById('newEmail').value;
      const currentPassword = document.getElementById('emailCurrentPassword').value;

      setLoading('email-btn', true);

      try {
        const res = await API.post('/auth/request-email-change', { newEmail, currentPassword });
        showAlert('alert', res.message, true);
        document.getElementById('change-email-form').reset();
      } catch (err) {
        showAlert('alert', err.message);
      } finally {
        setLoading('email-btn', false);
      }
    });
  </script>
</body>
</html>
