<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Drexora Account</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand-header">
        <a href="index.html" class="brand-title">Drexora Account</a>
      </div>
      <h1 class="page-title">Create Account</h1>
      <p class="page-subtitle">Set up your single Drexora account.</p>

      <div id="alert" class="alert"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" required placeholder="Alex Morgan">
        </div>
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" required autocomplete="email" placeholder="alex@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="new-password" placeholder="At least 8 characters">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" required autocomplete="new-password" placeholder="Repeat password">
        </div>
        <button type="submit" id="submit-btn" class="btn">Create Account</button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="login.html">Sign in</a></p>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    redirectIfAuthenticated();

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert('alert');

      const fullName = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        showAlert('alert', 'Passwords do not match');
        return;
      }

      setLoading('submit-btn', true);

      try {
        const res = await API.post('/auth/register', { fullName, email, password, confirmPassword });
        showAlert('alert', res.message, true);
        document.getElementById('register-form').reset();
      } catch (err) {
        showAlert('alert', err.message);
      } finally {
        setLoading('submit-btn', false);
      }
    });
  </script>
</body>
</html>
