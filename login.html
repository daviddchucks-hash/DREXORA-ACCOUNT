<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Drexora Account</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand-header">
        <a href="index.html" class="brand-title">Drexora Account</a>
      </div>
      <h1 class="page-title">Sign In</h1>
      <p class="page-subtitle">Enter your credentials to access your account.</p>

      <div id="alert" class="alert"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" id="submit-btn" class="btn">Sign In</button>
      </form>

      <div class="auth-footer">
        <p><a href="forgot-password.html">Forgot password?</a></p>
        <p style="margin-top: 8px;">Don't have an account? <a href="register.html">Create one</a></p>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    redirectIfAuthenticated();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert('alert');
      setLoading('submit-btn', true);

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await API.post('/auth/login', { email, password });
        if (res.token) {
          sessionStorage.setItem('drexora_token', res.token);
        }
        window.location.href = 'account.html';
      } catch (err) {
        setLoading('submit-btn', false);
        showAlert('alert', err.message);
      }
    });
  </script>
</body>
</html>
