<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connected Applications — Drexora Account</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav-bar">
    <div class="nav-container">
      <a href="account.html" class="brand-title">Drexora Account</a>
      <div class="nav-links">
        <a href="account.html" class="nav-link">Profile</a>
        <a href="security.html" class="nav-link">Security</a>
        <a href="sessions.html" class="nav-link">Sessions</a>
        <a href="connected-apps.html" class="nav-link active">Connected Apps</a>
        <a href="developer.html" class="nav-link">Developer</a>
        <a href="developer-docs.html" class="nav-link">Docs</a>
        <a href="#" onclick="handleLogout(); return false;" class="nav-link" style="color: var(--danger-color);">Sign Out</a>
      </div>
    </div>
  </nav>

  <div class="dashboard-wrapper">
    <h1 class="page-title">Connected Applications</h1>
    <p class="page-subtitle">Manage third-party and internal applications authorized to access your Drexora identity.</p>

    <div id="alert" class="alert"></div>

    <div class="card-section">
      <h2 class="section-title">Authorized Applications</h2>
      <div id="apps-list">
        <p style="color: var(--text-muted); font-size: 13px;">Loading connected applications...</p>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    async function loadConnectedApps() {
      const user = await requireAuth();
      if (!user) return;

      const container = document.getElementById('apps-list');

      try {
        const res = await API.get('/account/connected-apps');
        const apps = res.connectedApps || [];

        if (apps.length === 0) {
          container.innerHTML = `
            <div style="padding: 24px 0; text-align: center; color: var(--text-muted);">
              <p>No connected applications found.</p>
              <p style="font-size: 12px; margin-top: 4px;">Applications you authorize via "Continue with Drexora" will appear here.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = apps.map(app => `
          <div class="session-item" style="padding: 16px 0;">
            <div class="session-info">
              <div class="session-device" style="font-size: 14px; margin-bottom: 4px;">
                ${escapeHtml(app.applicationName)}
                <span class="badge ${app.appType === 'drexora_product' ? 'badge-active' : 'badge-unverified'}" style="margin-left: 8px;">
                  ${app.appType === 'drexora_product' ? 'Drexora Product' : 'External Application'}
                </span>
              </div>
              <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 6px;">${escapeHtml(app.description || 'No description provided')}</p>
              <div class="session-meta">
                <strong>Granted Permissions:</strong> ${(app.grantedScopes || []).map(s => `<code>${escapeHtml(s)}</code>`).join(', ')}
              </div>
              <div class="session-meta" style="margin-top: 4px;">
                Connected on ${new Date(app.grantedAt).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' })}
              </div>
            </div>
            <div>
              <button class="btn btn-sm btn-danger" onclick="revokeApp('${escapeHtml(app.clientId)}', '${escapeHtml(app.applicationName)}')">Revoke Access</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        showAlert('alert', err.message);
      }
    }

    async function revokeApp(clientId, appName) {
      if (!confirm(`Are you sure you want to revoke access for "${appName}"? This will invalidate all active sessions and tokens for this application.`)) return;

      hideAlert('alert');
      try {
        const res = await API.delete(`/account/connected-apps/${clientId}`);
        showAlert('alert', res.message || 'Access revoked successfully', true);
        loadConnectedApps();
      } catch (err) {
        showAlert('alert', err.message);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    loadConnectedApps();
  </script>
</body>
</html>
